packages:
  - apps/*
  - packages/*

# Single source of truth for versions shared across workspaces.
# Referenced as "catalog:" in each package.json so they can never drift.
catalog:
  typescript: ^7.0.2
  # Pinned to ^24 to match the Node bundled inside Electron 44 (24.21.0),
  # NOT npm's latest (26.x). The shared packages run inside Electron main.
  "@types/node": ^24.0.0
  vitest: ^5.0.1
  # Peer-depends on the exact vitest version; Dependabot bumps both together.
  "@vitest/coverage-v8": 5.0.1
  zod: ^4.6.5

# pnpm blocks install scripts by default; Electron's postinstall downloads its binary.
allowBuilds:
  # Electron's postinstall downloads its binary.
  electron: true
  # Builds the Windows installer (used by the release matrix on windows-latest).
  electron-winstaller: true
  # esbuild (via tsx) installs its platform binary.
  esbuild: true

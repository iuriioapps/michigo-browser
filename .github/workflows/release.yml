name: Release

on:
  push:
    tags: ["v*"]

jobs:
  desktop:
    # Electron apps must be built on the OS they target.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      # electron-builder needs write access to create the draft release.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build renderer and main
        run: pnpm --filter @michigo/desktop build

      - name: Package and upload to draft release
        run: pnpm --filter @michigo/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds are UNSIGNED for now. macOS will be Gatekeeper-blocked and
          # Windows will trigger SmartScreen until these are filled in.
          # macOS signing + notarization (needs an Apple Developer account):
          # CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

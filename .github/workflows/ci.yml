name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A new push to the same ref supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Must precede setup-node so that `cache: pnpm` can find the store.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mirrors `pnpm check` locally, but as discrete steps so a failure is
      # obvious from the job summary without opening the log.
      - name: Format
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # Catches broken files globs, a missing preload and fuse or ASAR
      # problems on every PR instead of at release time.
      - name: Package
        run: pnpm --filter @michigo/desktop exec electron-builder --dir --publish never
